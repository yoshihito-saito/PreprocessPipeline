name: Basic tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: basic-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  basic-tests:
    name: ${{ matrix.platform }} basic checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux
          - os: windows-latest
            platform: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux Qt runtime library
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1
      - name: Install test dependencies
        # Match the NumPy baseline in both environment manifests.
        run: python -m pip install ".[dev]" "numpy==1.26.4"
      - name: Run selected regressions
        timeout-minutes: 5
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          pipeline_tests = [
              "tests/cli",
              "tests/setup",
              "tests/preprocess/test_intan_validation.py",
              "tests/preprocess/test_disk_space.py",
              "tests/preprocess/test_kilosort_partition_channels.py",
              "tests/preprocess/test_chanmap3d_postprocess.py",
              "tests/preprocess/test_recording_serialization.py",
              "tests/preprocess/test_postprocess_cleanup.py",
              "tests/execution/test_input_identity.py",
              "tests/execution/test_progress.py",
              "tests/execution/test_headless_plotting.py",
          ]
          # GUI state must not carry into process-pool regression tests.
          gui_tests = [
              "tests/preprocess/test_chanmap_preservation.py",
              "tests/gui/test_gui_config_model.py::test_persistent_progress_updates_preserve_lines_across_polls",
              "tests/gui/test_gui_config_model.py::test_persistent_progress_uses_stage_rows_main_log_and_force_stop",
              "tests/gui/test_gui_move_outputs.py::test_move_rewrites_recovery_paths_and_copies_custom_destination_metadata",
              "tests/gui/test_gui_move_outputs.py::test_move_failure_keeps_source_and_destination_unchanged",
              "tests/gui/test_gui_move_outputs.py::test_move_rejects_equal_size_staging_corruption_before_source_deletion",
          ]
          with tempfile.TemporaryDirectory(prefix="pp-ci-") as temp_dir:
              test_root = Path(temp_dir)
              test_env = os.environ.copy()
              test_env["NUMBA_CACHE_DIR"] = str(test_root / "n")
              for group_name, selected_tests in (("pipeline", pipeline_tests), ("gui", gui_tests)):
                  print(f"Running {group_name} regressions in a separate pytest process", flush=True)
                  result = subprocess.run(
                      [sys.executable, "-m", "pytest", *selected_tests, "-vv", "-p", "no:cacheprovider",
                       "--basetemp", str(test_root / group_name), "--durations=5"],
                      env=test_env,
                  )
                  if result.returncode:
                      break
          sys.exit(result.returncode)
