# TeraSort mode: bounded (streaming/checkpoints) or kilosort4 (whole-recording KS4).
# Original KS1 is a separate raw-input/calibration route and is not supported here.
mode: bounded

# One waveform length for full KS4 or bounded seed learning/matching/Phy export.
# 41 samples / 20,000 Hz = 2.05 ms. TeraSort's standalone default remains 61.
# nt must be odd and >= 21 for the bounded raw-anchor holdout.
nt: 41

# KS4 compute backend for full sorting or initial bounded seed learning.
# auto, standard, deep_tiled, cublas. The bounded dense pass keeps its CUDA profile.
# Dedicated cublas requires nt=41 or 61, n_templates=6, and a native bridge.
ks4_backend: deep_tiled

# Native KS4 scientific overrides. Empty preserves existing KS4 seed defaults.
# Input sampling rate/gain/channel count/geometry come from PP metadata.
# PP owns filtering/reference; do not set highpass_cutoff or do_CAR here.
# Bounded uses these only for initial KS4 learning; nblocks must remain 0 there.
# Full kilosort4 uses native KS4 defaults, including nblocks=1, unless overridden.
ks4_settings: {}
# Example overrides (replace {} above with an indented mapping):
#   Th_single_ch: 6
#   Th_universal: 9
#   Th_learned: 8
#   n_templates: 6
#   nearest_chans: 10
#   whitening_range: 32
#   batch_size: 60000
#   nblocks: 0

# Optional bounded-only overrides; omit all of these for mode=kilosort4.
# The selected default profile is retained when a value is omitted.
# half_width: 8
# shift_radius: 2
# overlap_window_samples: 41  # default follows nt
# floor_snr: 4.5
# score_floor: 0.76
# residual_passes: 3
# max_candidates: 500000
# freeze_templates: false
# novelty: enroll            # off / shadow / enroll
# preset: default            # fast changes residual passes and novelty policy
# halo_ms: 100
# core_seconds: 2.0
# shard_seconds: 60.0
# read_buffer_mb: 64
# prefetch_depth: 4
# vram_limit_gb: 12.0         # CuPy pool budget; not a cap on all GPU allocations
